services:
  spark-master:
    build:
      context: ./docker
      dockerfile: Dockerfile
    image: diabetes-spark:3.5.3
    container_name: diabetes-spark-master
    entrypoint: []
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - 0.0.0.0
      - --port
      - "7077"
      - --webui-port
      - "8080"
    environment:
      - SPARK_NO_DAEMONIZE=true
      - PATH=/opt/spark/bin:/opt/spark/sbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    ports:
      - "7077:7077"   # master RPC
      - "8080:8080"   # master web UI
      - "4040:4040"   # driver application UI (when a job is running)
    volumes:
      - ./:/opt/app
    working_dir: /opt/app
    networks:
      - spark-net

  spark-worker-1:
    image: diabetes-spark:3.5.3
    container_name: diabetes-spark-worker-1
    entrypoint: []
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --webui-port
      - "8081"
      - --cores
      - "2"
      - --memory
      - 3g
      - spark://spark-master:7077
    environment:
      - SPARK_NO_DAEMONIZE=true
      - PATH=/opt/spark/bin:/opt/spark/sbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    ports:
      - "8081:8081"
    depends_on:
      - spark-master
    volumes:
      - ./:/opt/app
    working_dir: /opt/app
    networks:
      - spark-net

  spark-worker-2:
    image: diabetes-spark:3.5.3
    container_name: diabetes-spark-worker-2
    entrypoint: []
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --webui-port
      - "8081"
      - --cores
      - "2"
      - --memory
      - 3g
      - spark://spark-master:7077
    environment:
      - SPARK_NO_DAEMONIZE=true
      - PATH=/opt/spark/bin:/opt/spark/sbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    ports:
      - "8082:8081"
    depends_on:
      - spark-master
    volumes:
      - ./:/opt/app
    working_dir: /opt/app
    networks:
      - spark-net

  # One-shot Kafka producer for the online phase. Run on demand with
  #   docker compose run --rm producer                 # full offline.csv
  #   docker compose run --rm producer --limit 20      # smoke test
  # Lives behind a compose profile so `docker compose up -d` skips it.
  producer:
    build:
      context: .
      dockerfile: docker/Dockerfile.producer
    image: diabetes-producer:latest
    container_name: diabetes-producer
    environment:
      # Running inside diabetes-net, so reach the broker on its internal
      # advertised listener instead of localhost:9092.
      - KAFKA_BOOTSTRAP_HOST=kafka:29092
    volumes:
      - ./:/opt/app
    working_dir: /opt/app
    networks:
      - spark-net
    profiles:
      - producer

networks:
  spark-net:
    name: diabetes-net
    external: true
